name: Build MeyDownloader (EXE, Installer, APK)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ffmpeg:
        description: "ffmpeg flavor (slim = small, full = every codec)"
        default: slim
        type: choice
        options: [slim, full]

env:
  FFMPEG_FLAVOR: ${{ inputs.ffmpeg || 'slim' }}

jobs:
  # ---------------------------------------------------------------- slim ffmpeg for Windows
  ffmpeg-windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: ffout
          key: ffmpeg-win-${{ env.FFMPEG_FLAVOR }}-${{ hashFiles('tools/build_ffmpeg_slim.sh') }}
      - if: env.FFMPEG_FLAVOR == 'slim' && steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y mingw-w64 nasm
          tools/build_ffmpeg_slim.sh windows ffout
      - if: env.FFMPEG_FLAVOR == 'full'
        run: |
          rm -rf ffout && mkdir ffout
          curl -fsSL https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -o ff.zip
          unzip -q ff.zip && cp ffmpeg-*/bin/ffmpeg.exe ffmpeg-*/bin/ffprobe.exe ffout/
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows
          path: ffout/*.exe

  # ---------------------------------------------------------------- Windows exe + installer
  windows:
    needs: ffmpeg-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-desktop.txt
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-windows
          path: windows/bin
      - name: Fetch deno
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile deno.zip
          Expand-Archive deno.zip windows\bin -Force
      - name: Build app folder (for installer)
        timeout-minutes: 30
        env:
          KIVY_GL_BACKEND: angle_sdl2
          KIVY_NO_ARGS: "1"
        run: pyinstaller --noconfirm windows/meydownloader.spec
      - name: Build portable single exe
        shell: pwsh
        timeout-minutes: 30
        env:
          KIVY_GL_BACKEND: angle_sdl2
          KIVY_NO_ARGS: "1"
        run: |
          $env:MD_ONEFILE = "1"
          pyinstaller --noconfirm --workpath build-onefile --distpath dist-portable windows/meydownloader.spec
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows\installer.iss
      - name: Report sizes
        shell: pwsh
        run: |
          Get-ChildItem windows\bin, dist-portable, Output | Where-Object { -not $_.PSIsContainer } |
            Format-Table Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist-portable/MeyDownloader.exe
            Output/MeyDownloader-Setup.exe

  # ---------------------------------------------------------------- Android APK
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev xz-utils nasm
          pip install "buildozer==1.5.0" "cython==0.29.37"
      - id: ffcache
        uses: actions/cache@v4
        with:
          path: ffout
          key: android-native-${{ env.FFMPEG_FLAVOR }}-${{ hashFiles('tools/build_ffmpeg_slim.sh', 'tools/build_qjs_android.sh') }}
      - name: ffmpeg (slim, built with the Android NDK)
        if: env.FFMPEG_FLAVOR == 'slim' && steps.ffcache.outputs.cache-hit != 'true'
        run: ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME tools/build_ffmpeg_slim.sh android ffout
      - name: ffmpeg (full static)
        if: env.FFMPEG_FLAVOR == 'full' && steps.ffcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ffout
          curl -L https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-arm64-static.tar.xz | tar -xJ
          cp ffmpeg-*-arm64-static/ffmpeg ffout/libffmpeg.so
      - name: QuickJS (built with the Android NDK)
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME tools/build_qjs_android.sh ffout
      - name: Native libs (ffmpeg + QuickJS)
        run: |
          mkdir -p android_libs/arm64-v8a
          cp ffout/libffmpeg.so ffout/libqjs.so android_libs/arm64-v8a/
          chmod +x android_libs/arm64-v8a/*.so
          file android_libs/arm64-v8a/*.so
          ls -lh android_libs/arm64-v8a
      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-p4a2024-${{ hashFiles('buildozer.spec') }}
      - name: Build APK
        run: |
          set +o pipefail
          yes | buildozer android debug
      - run: ls -lh bin/
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: bin/*.apk

  # ---------------------------------------------------------------- launch test on an emulator
  # Installs the APK, opens it, and saves the Android log (logcat) so any
  # start-up crash is visible in the "android-logcat" artifact.
  android-smoke-test:
    needs: android
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          script: |
            adb install -r apk/*.apk
            adb logcat -c
            adb shell monkey -p com.meydownloader.meydownloader -c android.intent.category.LAUNCHER 1
            sleep 45
            adb logcat -d > logcat-full.txt
            grep -E "python|AndroidRuntime|DEBUG|SDL|libc|FATAL|meydownloader" logcat-full.txt > logcat.txt || true
            tail -n 150 logcat.txt
            adb shell pidof com.meydownloader.meydownloader && echo "APP IS RUNNING" || (echo "::error::App is not running - see android-logcat artifact" && exit 1)
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-logcat
          path: logcat*.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/dist-portable/MeyDownloader.exe
            windows/Output/MeyDownloader-Setup.exe
            android/*.apk

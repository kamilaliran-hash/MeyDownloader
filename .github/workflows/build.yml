name: Build MeyDownloader (EXE, Installer, APK)

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        run: pip install -r requirements-desktop.txt
      - name: Fetch ffmpeg + deno
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows\bin | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip ffx -Force
          Copy-Item ffx\*\bin\ffmpeg.exe, ffx\*\bin\ffprobe.exe windows\bin\
          Invoke-WebRequest https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip -OutFile deno.zip
          Expand-Archive deno.zip windows\bin -Force
      - name: Build EXE
        run: pyinstaller --noconfirm windows/meydownloader.spec
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/MeyDownloader.exe
            Output/MeyDownloader-Setup.exe

  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev xz-utils
          pip install buildozer "cython==0.29.37"
      - name: Fetch static arm64 ffmpeg + QuickJS
        run: |
          mkdir -p android_libs/arm64-v8a
          curl -L https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-arm64-static.tar.xz -o ff.tar.xz
          tar -xf ff.tar.xz
          cp ffmpeg-*-arm64-static/ffmpeg android_libs/arm64-v8a/libffmpeg.so
          curl -L https://github.com/quickjs-ng/quickjs/releases/latest/download/qjs-linux-aarch64 \
            -o android_libs/arm64-v8a/libqjs.so || echo "::warning::QuickJS download failed"
          chmod +x android_libs/arm64-v8a/*.so
      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
      - name: Build APK
        run: |
          set +o pipefail
          yes | buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: bin/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            windows/dist/MeyDownloader.exe
            windows/Output/MeyDownloader-Setup.exe
            android/*.apk
